<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="icon" href="https://www.df.unipi.it/wp-content/uploads/2025/03/cropped-favf-192x192.png">
<title id="pageTitle">Bozza Orario</title>
<style>
  :root {
    --bg: #f8f9fa;
    --panel: #fff;
    --border: #e0e0e0;
    --grid: #ececec;
    --text: #222;
    --muted: #666;
    --accent: #1a73e8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .header-row {
    padding: 8px 16px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  .header-row.top h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .header-row .filters { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
  .header-row input, .header-row select {
    padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px;
    font-size: 13px; background: #fff;
  }
  .header-row input[type="text"] { min-width: 220px; }
  .header-row button {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.2;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    color: inherit;
    cursor: pointer;
    margin: 0;
    box-sizing: border-box;
  }
  .header-row button:hover { background: #f0f0f0; }
  .header-row.aule {
    border-top: 1px solid var(--border);
    background: #fafbfc;
    align-items: flex-start;
  }
  .header-row.aule .label,
  .room-checks .sub-label {
    font-weight: 600;
    color: var(--text);
    font-size: 13px;
    line-height: 1.2;
    align-self: center;
    margin-right: 6px;
    white-space: nowrap;
  }
  .room-checks {
    display: flex; flex-wrap: wrap; gap: 4px 12px; flex: 1;
    align-items: center;
  }
  .vsep {
    display: inline-block;
    width: 1px;
    background: var(--border);
    align-self: stretch;
    margin: 4px 4px;
  }
  .room-checks .sub-group {
    display: inline-flex; align-items: stretch; margin-right: 16px;
  }
  .room-toggle {
    font-family: inherit;
    font-size: 13px;
    line-height: 1.2;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 0;
    background: #fff;
    color: inherit;
    cursor: pointer;
    margin: 0;
    box-sizing: border-box;
    font-weight: normal;
    appearance: none;
    -webkit-appearance: none;
  }
  .room-toggle[data-on="1"] {
    background: #e8f0fe;
    border-color: #1a73e8;
    color: #1a73e8;
    font-weight: 600;
    z-index: 1;
    position: relative;
  }
  .room-toggle:not(:first-child) { margin-left: -1px; }
  .room-toggle:first-child { border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
  .room-toggle:last-child { border-top-right-radius: 4px; border-bottom-right-radius: 4px; }
  .room-toggle:hover { background: #f3f6fb; }
  .room-toggle[data-on="1"]:hover { background: #d6e4fc; }

  #grid {
    display: grid;
    grid-template-columns: 60px repeat(6, 1fr);
    gap: 0;
    padding: 12px;
    min-width: 800px;
  }
  .day-header {
    background: #e8f0fe;
    border: 1px solid var(--grid);
    padding: 6px 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    text-align: center;
  }
  .time-label {
    font-size: 11px;
    color: var(--muted);
    padding-right: 6px;
    text-align: right;
    background: transparent;
    border: none;
    white-space: nowrap;
  }
  .day-col {
    position: relative;
    border: 1px solid var(--grid);
    background: var(--panel);
  }
  .slot-line {
    position: absolute; left: 0; right: 0;
    border-top: 1px dotted #f0f0f0;
  }
  .session {
    position: absolute;
    left: 2px; right: 2px;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    line-height: 1.25;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    border-left: 4px solid;
    cursor: default;
  }
  .session .code { font-weight: 700; }
  .session .meta { color: var(--muted); font-size: 10px; }
  .session.hidden { display: none; }
  .legend {
    display: flex; gap: 12px; padding: 8px 16px; font-size: 12px; color: var(--muted);
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .legend .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    margin-right: 4px; vertical-align: middle;
  }
  .footer {
    text-align: center; color: var(--muted); font-size: 11px; padding: 12px;
  }

  /* Edit mode badge */
  .edit-badge {
    display: inline-flex; align-items: center; gap: 4px;
    margin-left: auto;
    padding: 3px 10px; border-radius: 12px;
    background: #fff4e5; color: #b95000;
    border: 1px solid #ffcc80;
    font-size: 11px; font-weight: 600;
    cursor: pointer; user-select: none;
  }
  .edit-badge.active { background: #e6f4ea; color: #137333; border-color: #81c995; }
  .edit-badge .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
  }

  /* Tab switcher */
  .view-tabs {
    display: flex; gap: 0; padding: 0 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .view-tab {
    padding: 8px 16px; cursor: pointer; user-select: none;
    border: 1px solid transparent; border-bottom: none;
    background: transparent; font-size: 13px; color: var(--muted);
    font-family: inherit; line-height: 1.2;
    border-top-left-radius: 4px; border-top-right-radius: 4px;
    margin-bottom: -1px;
  }
  .view-tab:hover { background: #f3f6fb; }
  .view-tab.active {
    background: var(--bg); color: var(--text); font-weight: 600;
    border-color: var(--border);
  }
  .view-tab .edit-tag {
    display: inline-block; margin-left: 6px;
    padding: 1px 8px; border-radius: 10px;
    background: #137333; color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
    vertical-align: middle;
  }
  .view-tab.edit-on { background: #e6f4ea; color: #137333; }
  .view-tab.edit-on.active { background: #d4edda; color: #0b5828; border-color: #81c995; }
  .view { display: none; }
  .view.active { display: block; }

  /* Vista "Aule" — griglia visuale per giorno con timeline orizzontale */
  #viewRooms { padding: 12px 16px; overflow-x: auto; }
  .day-section { margin-bottom: 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; }
  .day-section h3 {
    margin: 0 0 6px 0; font-size: 14px; font-weight: 600;
    border-bottom: 1px solid var(--border); padding-bottom: 4px;
  }
  .day-grid { font-size: 11px; min-width: max-content; }
  .day-grid .grid-row {
    display: grid; grid-template-columns: 130px 1fr;
    align-items: stretch; min-height: 26px;
  }
  .day-grid .grid-row.header { min-height: 22px; }
  .day-grid .room-label {
    padding: 4px 8px 4px 0; font-weight: 600; color: var(--text);
    border-right: 1px solid var(--border);
    display: flex; align-items: center;
  }
  .day-grid .room-label-empty { color: var(--muted); font-weight: 400; font-size: 10px; }
  .day-grid .room-track {
    position: relative;
    background:
      /* maschera orizzontale: alterna trasparente (3px) e bianco-panel (3px)
         crea effetto tratteggio sulle linee verticali sottostanti.
         Nei punti senza linee verticali e' invisibile (sfondo gia' bianco). */
      repeating-linear-gradient(0deg,
        transparent 0 3px,
        var(--panel) 3px 6px),
      /* linee ore (piu' scure) */
      repeating-linear-gradient(to right,
        transparent 0, transparent calc(var(--hour-w) - 1px),
        #b0b0b0 calc(var(--hour-w) - 1px), #b0b0b0 var(--hour-w)),
      /* linee mezzore (piu' chiare) */
      repeating-linear-gradient(to right,
        transparent 0, transparent calc(var(--halfhour-w) - 1px),
        #d8d8d8 calc(var(--halfhour-w) - 1px), #d8d8d8 var(--halfhour-w));
    min-width: var(--track-w);
    border-bottom: 1px solid #f5f5f5;
    min-height: 42px;
  }
  .day-grid .grid-row { min-height: 42px; }
  .day-grid .grid-row.header { min-height: 22px; }
  .day-grid .grid-row.hidden { display: none; }
  .day-grid .time-axis {
    position: relative; min-width: var(--track-w); height: 18px;
    border-bottom: 1px solid var(--border);
  }
  .day-grid .time-tick {
    position: absolute; top: 0; font-size: 10px; color: var(--muted);
    transform: translateX(-50%);
  }
  .ablock {
    position: absolute; top: 2px; bottom: 2px;
    padding: 2px 6px; border-radius: 3px; border-left: 3px solid;
    font-size: 11px; line-height: 1.15;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    box-sizing: border-box;
    display: flex; flex-direction: column; justify-content: center;
  }
  .ablock.hidden { display: none; }
  .ablock .ablock-line {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    width: 100%;
  }
  .ablock .ablock-code { font-weight: 700; }
  .ablock .ablock-time { color: var(--muted); font-size: 10px; }
  .ablock .ablock-name { font-size: 10px; }
  .ablock.editable { cursor: grab; user-select: none; }
  .ablock.editable.dragging { opacity: 0.7; cursor: grabbing; outline: 2px solid #1a73e8; z-index: 100; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
  .ablock.editable.conflict { outline: 2px solid #c00; }
  .ablock.committing { opacity: 0.5; pointer-events: none; }
  .ablock .resize-handle {
    position: absolute; top: 0; bottom: 0; width: 6px; cursor: ew-resize;
    background: transparent;
  }
  .ablock .resize-handle.left { left: 0; }
  .ablock .resize-handle.right { right: 0; }
  .ablock.editable:hover .resize-handle { background: rgba(26,115,232,0.3); }
  .day-section.hidden { display: none; }
  /* Blocchi NON DISPONIBILE (read-only, non draggabili) */
  .ablock.ablock-unavail {
    background: #cccccc;
    color: #fff;
    font-weight: 700;
    font-style: italic;
    border-left: 3px solid #888;
    cursor: default;
    text-align: left;
  }
  .ablock.ablock-unavail .ablock-line { color: #fff; }
</style>
</head>
<body>
<header>
  <div class="header-row top">
    <h1 id="pageH1">📅 Bozza Orario</h1>
    <span id="editBadge" class="edit-badge" style="display:none" title=""><span class="dot"></span> <span id="editBadgeLabel">read-only</span></span>
    <div class="filters">
      <input type="text" id="q" placeholder="Cerca codice / nome / docente..."
        title="Sintassi:&#10;• una parola → match singolo&#10;• &quot;frase con spazi&quot; → token unico (puoi usare le virgolette)&#10;• A B → A or B (default)&#10;• A or B → A or B&#10;• A and B → A e B insieme&#10;Esempi:&#10;• fisica → corsi con &quot;fisica&quot;&#10;• cei mannella → docenti Cei o Mannella&#10;• &quot;analisi matematica&quot; → solo corsi col nome esatto&#10;• &quot;analisi matematica&quot; and lab → labs di Analisi Matematica&#10;Oltre 2 token / 3 con operatore: ignorato.">
      <select id="fPds" title="Filtra per piano di studio (PdS)">
        <option value="">Tutti i corsi</option>
        <option value="LT">Tutta LT</option>
        <option value="LM">Tutta LM</option>
      </select>
      <select id="fSheet"><option value="">Tutti i fogli</option></select>
      <select id="fGruppo"><option value="">Tutti i gruppi</option></select>
      <select id="fAnno">
        <option value="">Tutti gli anni</option>
        <option value="1">Anno 1</option>
        <option value="2">Anno 2</option>
        <option value="3">Anno 3</option>
      </select>
      <button id="btnReset">Reset</button>
    </div>
  </div>
  <div class="header-row aule">
    <span class="label">Aule/Labs:</span>
    <button id="btnAllRooms">Tutte</button>
    <button id="btnNoRooms">Nessuna</button>
    <span class="vsep"></span>
    <div class="room-checks" id="roomChecks">
      <span class="sub-label">Aule:</span>
      <span id="roomChecksAule" class="sub-group"></span>
      <span class="sub-label">Labs:</span>
      <span id="roomChecksLab" class="sub-group"></span>
    </div>
  </div>
</header>
<div class="legend" id="legend"></div>
<div class="view-tabs">
  <button class="view-tab active" data-view="sessions" type="button">📅 Calendario</button>
  <button class="view-tab" data-view="rooms" type="button">🏛 Aule</button>
</div>
<div id="viewSessions" class="view active">
  <div id="grid"></div>
</div>
<div id="viewRooms" class="view"></div>
<div class="footer" id="footer"></div>

<script>
var BOOTSTRAP = <?!= bootstrap ?>;
var EDIT_MODE = <?!= editMode ?>;
var USER_EMAIL = <?!= JSON.stringify(userEmail || '') ?>;

(function(){
  const data = BOOTSTRAP;
  const days = data.days;
  // Titolo dinamico in base al semestre (S1/S2)
  const semLabel = 'Bozza Orario ' + (data.semester || 'S1');
  document.getElementById('pageTitle').textContent = semLabel;
  document.getElementById('pageH1').textContent = '📅 ' + semLabel;
  document.title = semLabel;

  // Edit-mode badge
  const editBadge = document.getElementById('editBadge');
  const editBadgeLabel = document.getElementById('editBadgeLabel');
  editBadge.style.display = 'inline-flex';
  if (EDIT_MODE) {
    editBadge.classList.add('active');
    editBadgeLabel.textContent = 'EDIT';
    editBadge.title = 'Modalità edit attiva — ' + (USER_EMAIL || 'utente loggato');
  } else {
    editBadge.classList.remove('active');
    editBadgeLabel.textContent = 'read-only';
    editBadge.title = USER_EMAIL ? ('Loggato come ' + USER_EMAIL + ' — non in EDIT_EMAILS') : 'Anonimo / non identificato';
  }
  const slotStart = data.slotStartMin;
  const slotEnd = data.slotEndMin;
  const PX_PER_MIN = 0.7;
  const HEADER_H = 32;

  const grid = document.getElementById('grid');
  const totalMinutes = slotEnd - slotStart;
  const colHeight = totalMinutes * PX_PER_MIN;

  grid.innerHTML = '';
  const corner = document.createElement('div');
  corner.className = 'day-header';
  corner.style.height = HEADER_H + 'px';
  grid.appendChild(corner);
  days.forEach(d => {
    const h = document.createElement('div');
    h.className = 'day-header';
    h.textContent = d;
    h.style.height = HEADER_H + 'px';
    grid.appendChild(h);
  });

  const tcol = document.createElement('div');
  tcol.style.position = 'relative';
  tcol.style.height = colHeight + 'px';
  tcol.style.gridColumn = '1';
  tcol.style.gridRow = '2';
  // Etichette ora: una per riga tratteggiata (ogni 60 min), allineate alla riga
  for (let m = slotStart; m <= slotEnd; m += 60) {
    const lab = document.createElement('div');
    lab.className = 'time-label';
    lab.textContent = fmt(m);
    lab.style.position = 'absolute';
    lab.style.top = ((m - slotStart) * PX_PER_MIN) + 'px';
    lab.style.left = '0';
    lab.style.right = '0';
    lab.style.transform = 'translateY(-50%)';
    tcol.appendChild(lab);
  }
  grid.appendChild(tcol);

  const dayColEls = [];
  for (let d = 0; d < days.length; d++) {
    const c = document.createElement('div');
    c.className = 'day-col';
    c.style.position = 'relative';
    c.style.height = colHeight + 'px';
    c.style.gridColumn = (d + 2) + '';
    c.style.gridRow = '2';
    for (let m = slotStart; m <= slotEnd; m += 60) {
      const ln = document.createElement('div');
      ln.className = 'slot-line';
      ln.style.top = ((m - slotStart) * PX_PER_MIN) + 'px';
      ln.style.borderTopColor = '#e0e0e0';
      c.appendChild(ln);
    }
    grid.appendChild(c);
    dayColEls.push(c);
  }

  // Layout overlap-aware: ricalcolato a ogni applyFilters sulla base dei visibili
  function relayoutVisible() {
    const perDay = [];
    for (let i = 0; i < days.length; i++) perDay.push([]);
    sessionEls.forEach(el => {
      if (el.classList.contains('hidden')) return;
      perDay[parseInt(el.dataset.day, 10)].push(el);
    });
    perDay.forEach(items => {
      items.sort((a, b) => {
        const sa = +a.dataset.start, sb = +b.dataset.start;
        if (sa !== sb) return sa - sb;
        return (+b.dataset.end) - (+a.dataset.end);
      });
      const clusters = [];
      let cluster = [];
      let clusterEnd = -Infinity;
      items.forEach(el => {
        const s = +el.dataset.start, e = +el.dataset.end;
        if (s >= clusterEnd && cluster.length) {
          clusters.push(cluster);
          cluster = [];
          clusterEnd = -Infinity;
        }
        cluster.push(el);
        clusterEnd = Math.max(clusterEnd, e);
      });
      if (cluster.length) clusters.push(cluster);
      clusters.forEach(cl => {
        const lanes = [];
        cl.forEach(el => {
          const s = +el.dataset.start, e = +el.dataset.end;
          let lane = -1;
          for (let i = 0; i < lanes.length; i++) {
            if (lanes[i] <= s) { lane = i; break; }
          }
          if (lane === -1) lane = lanes.length;
          lanes[lane] = e;
          el._lane = lane;
        });
        const lanesCount = lanes.length;
        cl.forEach(el => {
          const widthPct = 100 / lanesCount;
          el.style.left = 'calc(' + (el._lane * widthPct) + '% + 2px)';
          el.style.width = 'calc(' + widthPct + '% - 4px)';
          el.style.zIndex = String(10 + el._lane);
        });
      });
    });
  }

  // Switch tra le viste (calendario / aule).
  // Il tab "Aule" è visibile SOLO agli editor (EDIT_MODE === true)
  // e mostra un badge "EDIT" verde per indicare che drag/resize sono attivi.
  const auleTab = document.querySelector('.view-tab[data-view="rooms"]');
  if (!EDIT_MODE) {
    if (auleTab) auleTab.style.display = 'none';
    const auleView = document.getElementById('viewRooms');
    if (auleView) auleView.style.display = 'none';
    // Nascondi anche la barra tab se rimane un solo tab visibile
    const tabsBar = document.querySelector('.view-tabs');
    if (tabsBar) tabsBar.style.display = 'none';
  } else if (auleTab) {
    auleTab.classList.add('edit-on');
    auleTab.innerHTML = '🏛 Aule <span class="edit-tag">EDIT</span>';
    auleTab.title = 'Modalità edit attiva: drag/resize degli slot orari abilitato per ' + (USER_EMAIL || 'utente loggato');
  }
  document.querySelectorAll('.view-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.view-tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('view' + t.dataset.view.charAt(0).toUpperCase() + t.dataset.view.slice(1)).classList.add('active');
      // dopo lo switch: ricalcola layout calendario (le dimensioni potrebbero essere stale)
      if (t.dataset.view === 'sessions') relayoutVisible();
    });
  });

  // Sessioni (NON DISPONIBILE escluse: data.unavail ignorato)
  const sessionEls = [];
  const rsessionEls = [];  // gemelle per la vista "Aule"
  const unavailEls = [];   // blocchi NON DISPONIBILE (solo vista Aule)

  // ----- Vista "Aule": griglia visuale per giorno -----
  const PX_PER_MIN_AULE = 1.3; // larghezza orizzontale
  const HOUR_PX = 60 * PX_PER_MIN_AULE;
  const TRACK_PX = (slotEnd - slotStart) * PX_PER_MIN_AULE;
  const viewRooms = document.getElementById('viewRooms');
  // daySections[d] = { section, tracks: {roomName: trackEl} }
  const daySections = [];

  function buildAuleView() {
    viewRooms.innerHTML = '';
    daySections.length = 0;
    for (let d = 0; d < days.length; d++) {
      const section = document.createElement('div');
      section.className = 'day-section';
      section.dataset.day = String(d);
      section.innerHTML = '<h3>' + days[d] + '</h3>';
      const grid = document.createElement('div');
      grid.className = 'day-grid';
      grid.style.setProperty('--track-w', TRACK_PX + 'px');
      grid.style.setProperty('--hour-w', HOUR_PX + 'px');
      grid.style.setProperty('--halfhour-w', (HOUR_PX / 2) + 'px');

      // Riga asse temporale
      const headerRow = document.createElement('div');
      headerRow.className = 'grid-row header';
      headerRow.innerHTML = '<div class="room-label"><span class="room-label-empty">(orario)</span></div>';
      const ta = document.createElement('div');
      ta.className = 'time-axis';
      for (let m = slotStart; m <= slotEnd; m += 60) {
        const t = document.createElement('span');
        t.className = 'time-tick';
        t.style.left = ((m - slotStart) * PX_PER_MIN_AULE) + 'px';
        t.textContent = fmt(m);
        ta.appendChild(t);
      }
      headerRow.appendChild(ta);
      grid.appendChild(headerRow);

      const tracks = {};
      data.rooms.forEach(room => {
        const row = document.createElement('div');
        row.className = 'grid-row';
        row.dataset.room = room;
        row.dataset.day = String(d);
        const lab = document.createElement('div');
        lab.className = 'room-label';
        lab.textContent = room;
        row.appendChild(lab);
        const track = document.createElement('div');
        track.className = 'room-track';
        track.dataset.room = room;
        track.dataset.day = String(d);
        row.appendChild(track);
        grid.appendChild(row);
        tracks[room] = track;
      });

      section.appendChild(grid);
      viewRooms.appendChild(section);
      daySections.push({ section: section, tracks: tracks });
    }
  }

  function makeAuleBlock(s) {
    const block = document.createElement('div');
    block.className = 'ablock';
    block.style.background = s.vincoloColor || '#fff';
    block.style.borderLeftColor = s.sheetColor || '#888';
    block.dataset.origBg = s.vincoloColor || '#fff';
    block.dataset.code = (s.code || '').toLowerCase();
    block.dataset.name = (s.name || '').toLowerCase();
    block.dataset.titolare = (s.titolare || '').toLowerCase();
    block.dataset.sheet = s.sheet;
    block.dataset.room = s.room;
    block.dataset.gruppo = s.group;
    block.dataset.anno = s.anno || '';
    block.dataset.day = String(s.day);
    block.dataset.start = String(s.start);
    block.dataset.end = String(s.end);
    if (s.src) block.dataset.src = JSON.stringify(s.src);

    const left = (s.start - slotStart) * PX_PER_MIN_AULE;
    const width = (s.end - s.start) * PX_PER_MIN_AULE;
    block.style.left = left + 'px';
    block.style.width = Math.max(width - 2, 20) + 'px';

    const tag = s.group ? (s.code + ' [' + s.group + ']') : s.code;
    // Due righe: riga 1 = code+name (truncato); riga 2 = time
    block.innerHTML =
      '<div class="ablock-line">' +
        '<span class="ablock-code" style="color:' + (s.sheetColor || 'inherit') + '">' + esc(tag) + '</span>' +
        (s.name ? ' <span class="ablock-name">' + esc(s.name) + '</span>' : '') +
      '</div>' +
      '<div class="ablock-line ablock-time">' + fmt(s.start) + '–' + fmt(s.end) + '</div>';
    block.title =
      tag + (s.name ? ' — ' + s.name : '') + '\n' +
      fmt(s.start) + '-' + fmt(s.end) + ' ' + s.room + '\n' +
      (s.titolare ? 'Titolare: ' + s.titolare + '\n' : '') +
      (s.tipo ? 'Tipo: ' + (s.tipoLabel || s.tipo) + '\n' : '') +
      'Gruppo: ' + (s.group || 'N/A') +
      (s.periodo ? '\nPeriodo: ' + s.periodo : '') +
      (s.mutuanti ? '\nMutuazione: ' + s.mutuanti : '');

    if (EDIT_MODE) {
      block.classList.add('editable');
      const lh = document.createElement('div');
      lh.className = 'resize-handle left';
      block.appendChild(lh);
      const rh = document.createElement('div');
      rh.className = 'resize-handle right';
      block.appendChild(rh);
      attachEditHandlers(block);
    }
    return block;
  }

  function renderAuleSessions() {
    // Pulisci tracce
    daySections.forEach(ds => {
      Object.values(ds.tracks).forEach(t => { t.innerHTML = ''; });
    });
    rsessionEls.length = 0;
    unavailEls.length = 0;
    data.sessions.forEach(s => {
      const ds = daySections[s.day];
      if (!ds) return;
      const track = ds.tracks[s.room];
      if (!track) return;
      const block = makeAuleBlock(s);
      track.appendChild(block);
      rsessionEls.push(block);
    });
    // Indisponibilita' (read-only, non draggabili) renderizzate dopo le sessioni
    (data.unavail || []).forEach(u => {
      const ds = daySections[u.day];
      if (!ds) return;
      const track = ds.tracks[u.room];
      if (!track) return;
      const block = document.createElement('div');
      block.className = 'ablock ablock-unavail';
      block.dataset.day = String(u.day);
      block.dataset.start = String(u.start);
      block.dataset.end = String(u.end);
      block.dataset.room = u.room;
      const left = (u.start - slotStart) * PX_PER_MIN_AULE;
      const width = (u.end - u.start) * PX_PER_MIN_AULE;
      block.style.left = left + 'px';
      block.style.width = Math.max(width - 2, 20) + 'px';
      block.innerHTML =
        '<div class="ablock-line">' + esc(u.text) + '</div>' +
        '<div class="ablock-line ablock-time">' + fmt(u.start) + '–' + fmt(u.end) + '</div>';
      block.title = u.text + ' · ' + u.room + ' · ' + fmt(u.start) + '-' + fmt(u.end);
      track.appendChild(block);
      unavailEls.push(block);
    });
  }

  // ----- Drag/Resize handlers (solo EDIT_MODE) -----
  function attachEditHandlers(block) {
    let mode = null; // 'move' | 'resize-l' | 'resize-r'
    let pId = null;
    let startX = 0, startY = 0;
    let origLeft = 0, origWidth = 0;
    let origDay = 0, origRoom = '';
    let curDay, curRoom;

    function onDown(e) {
      if (block.classList.contains('committing')) return;
      mode = 'move';
      if (e.target.classList && e.target.classList.contains('resize-handle')) {
        mode = e.target.classList.contains('left') ? 'resize-l' : 'resize-r';
      }
      pId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      origLeft = parseFloat(block.style.left) || 0;
      origWidth = parseFloat(block.style.width) || 0;
      origDay = parseInt(block.dataset.day, 10);
      origRoom = block.dataset.room;
      curDay = origDay;
      curRoom = origRoom;
      block.setPointerCapture(pId);
      block.classList.add('dragging');
      e.preventDefault();
      e.stopPropagation();
    }

    function onMove(e) {
      if (e.pointerId !== pId || !mode) return;
      const dx = e.clientX - startX;
      const snap = Math.round(dx / (30 * PX_PER_MIN_AULE)) * (30 * PX_PER_MIN_AULE);

      if (mode === 'move') {
        let newLeft = origLeft + snap;
        if (newLeft < 0) newLeft = 0;
        if (newLeft + origWidth > TRACK_PX) newLeft = TRACK_PX - origWidth;
        block.style.left = newLeft + 'px';

        // Possibile cambio aula/giorno tramite hit-test sull'elemento sotto al pointer
        const elBelow = document.elementFromPoint(e.clientX, e.clientY);
        const trackBelow = elBelow ? elBelow.closest('.room-track') : null;
        if (trackBelow && trackBelow !== block.parentNode) {
          // Sposta visualmente in altra track (cambio aula o giorno)
          curRoom = trackBelow.dataset.room;
          curDay = parseInt(trackBelow.dataset.day, 10);
          trackBelow.appendChild(block);
          block.dataset.room = curRoom;
          block.dataset.day = String(curDay);
        }
        const newStart = slotStart + Math.round(newLeft / PX_PER_MIN_AULE);
        const newEnd = newStart + Math.round(origWidth / PX_PER_MIN_AULE);
        block.dataset.start = String(newStart);
        block.dataset.end = String(newEnd);
        const tEl = block.querySelector('.ablock-time');
        if (tEl) tEl.textContent = fmt(newStart) + '–' + fmt(newEnd);
      } else if (mode === 'resize-l') {
        let newLeft = origLeft + snap;
        if (newLeft < 0) newLeft = 0;
        if (newLeft >= origLeft + origWidth - 30 * PX_PER_MIN_AULE) {
          newLeft = origLeft + origWidth - 30 * PX_PER_MIN_AULE; // min 30 min
        }
        const newWidth = origLeft + origWidth - newLeft;
        block.style.left = newLeft + 'px';
        block.style.width = (newWidth - 2) + 'px';
        const newStart = slotStart + Math.round(newLeft / PX_PER_MIN_AULE);
        const newEnd = newStart + Math.round(newWidth / PX_PER_MIN_AULE);
        block.dataset.start = String(newStart);
        block.dataset.end = String(newEnd);
        const tEl = block.querySelector('.ablock-time');
        if (tEl) tEl.textContent = fmt(newStart) + '–' + fmt(newEnd);
      } else if (mode === 'resize-r') {
        let newWidth = origWidth + snap;
        if (newWidth < 30 * PX_PER_MIN_AULE) newWidth = 30 * PX_PER_MIN_AULE;
        if (origLeft + newWidth > TRACK_PX) newWidth = TRACK_PX - origLeft;
        block.style.width = (newWidth - 2) + 'px';
        const newStart = slotStart + Math.round(origLeft / PX_PER_MIN_AULE);
        const newEnd = newStart + Math.round(newWidth / PX_PER_MIN_AULE);
        block.dataset.end = String(newEnd);
        const tEl = block.querySelector('.ablock-time');
        if (tEl) tEl.textContent = fmt(newStart) + '–' + fmt(newEnd);
      }
    }

    function onUp(e) {
      if (e.pointerId !== pId || !mode) return;
      try { block.releasePointerCapture(pId); } catch (err) {}
      block.classList.remove('dragging');
      const finalMode = mode;
      mode = null;
      pId = null;

      const newStart = parseInt(block.dataset.start, 10);
      const newEnd = parseInt(block.dataset.end, 10);
      const newRoom = block.dataset.room;
      const newDay = parseInt(block.dataset.day, 10);

      let src;
      try { src = JSON.parse(block.dataset.src || 'null'); } catch (err) { src = null; }
      if (!src) { revertBlock(block); return; }

      // No-op se nulla è cambiato
      const orig = data.sessions.find(s => s.src && s.src.sheet === src.sheet
        && s.src.row === src.row && s.src.col === src.col && s.src.idx === src.idx);
      if (orig && orig.start === newStart && orig.end === newEnd
          && orig.room === newRoom && orig.day === newDay) {
        revertBlock(block);
        return;
      }

      // Target col: shift if day changed
      const newCol = src.col + (newDay - (orig ? orig.day : newDay));
      const target = {
        sheet: src.sheet, row: src.row, col: newCol,
        room: newRoom, start: newStart, end: newEnd
      };

      commitEdit(block, src, target);
    }

    block.addEventListener('pointerdown', onDown);
    block.addEventListener('pointermove', onMove);
    block.addEventListener('pointerup', onUp);
    block.addEventListener('pointercancel', () => { mode = null; pId = null; block.classList.remove('dragging'); });
  }

  function revertBlock(block) {
    // Ricostruisce la posizione dal data.sessions corrente
    let src;
    try { src = JSON.parse(block.dataset.src || 'null'); } catch (e) { return; }
    if (!src) return;
    const orig = data.sessions.find(s => s.src && s.src.sheet === src.sheet
      && s.src.row === src.row && s.src.col === src.col && s.src.idx === src.idx);
    if (!orig) return;
    block.dataset.room = orig.room;
    block.dataset.day = String(orig.day);
    block.dataset.start = String(orig.start);
    block.dataset.end = String(orig.end);
    const left = (orig.start - slotStart) * PX_PER_MIN_AULE;
    const width = (orig.end - orig.start) * PX_PER_MIN_AULE;
    block.style.left = left + 'px';
    block.style.width = Math.max(width - 2, 20) + 'px';
    const tEl2 = block.querySelector('.ablock-time');
    if (tEl2) tEl2.textContent = fmt(orig.start) + '–' + fmt(orig.end);
    // Re-attach al track corretto
    const ds = daySections[orig.day];
    if (ds && ds.tracks[orig.room] && ds.tracks[orig.room] !== block.parentNode) {
      ds.tracks[orig.room].appendChild(block);
    }
  }

  function commitEdit(block, src, target) {
    block.classList.add('committing');
    google.script.run
      .withSuccessHandler(function(newJson) {
        block.classList.remove('committing');
        try {
          const newData = JSON.parse(newJson);
          // Sostituisci data e rerender tutto
          for (const k in newData) data[k] = newData[k];
          rerenderAfterEdit();
        } catch (err) {
          alert('Errore decoding snapshot: ' + err.message);
          revertBlock(block);
        }
      })
      .withFailureHandler(function(err) {
        block.classList.remove('committing');
        alert('Modifica rifiutata: ' + (err && err.message ? err.message : err));
        revertBlock(block);
      })
      .applyEditSlot({ src: src, target: target });
  }

  function rerenderAfterEdit() {
    // Rebuild calendar view sessions
    sessionEls.forEach(el => el.remove());
    sessionEls.length = 0;
    rsessionEls.length = 0;
    renderCalendarSessions();
    renderAuleSessions();
    applyFilters();
  }

      el.dataset.start = String(s.start);

      el.dataset.name = (s.name || '').toLowerCase();
      el.dataset.titolare = (s.titolare || '').toLowerCase();
      el.dataset.sheet = s.sheet;
      el.dataset.room = s.room;
      el.dataset.gruppo = s.group;

        '</div>' +
        '<div>' + esc(s.name) + '</div>' +
        '<div class="meta">' + fmt(s.start) + '-' + fmt(s.end) + ' · ' + esc(s.room) + '</div>' +
        (s.titolare ? '<div class="meta">' + esc(s.titolare) + '</div>' : '') +
        '<div class="meta">' + (s.tipoLabel || s.tipo || '') + (s.tipo ? ' · ' : '') + esc(groupLine) + '</div>' +
        (s.mutuanti ? '<div class="meta" style="opacity:.8">↺ ' + esc(s.mutuanti) + '</div>' : '');
      el.title =
        tag + (s.name ? ' — ' + s.name : '') + '\n' +
        fmt(s.start) + '-' + fmt(s.end) + ' ' + s.room + '\n' +
        (s.titolare ? 'Titolare: ' + s.titolare + '\n' : '') +
        (s.tipo ? 'Tipo: ' + (s.tipoLabel || s.tipo) + '\n' : '') +
        'Gruppo: ' + (s.group || 'N/A') +
        (s.periodo ? '\nPeriodo: ' + s.periodo : '') +
        (s.mutuanti ? '\nMutuazione: ' + s.mutuanti : '');
      dayColEls[s.day].appendChild(el);
      sessionEls.push(el);
    });

  // Init render: prima il calendar, poi la vista Aule (richiedono dayColEls/daySections)
  buildAuleView();
  renderCalendarSessions();
  renderAuleSessions();

  // Filtri
  function fillSelect(id, items) {
    const sel = document.getElementById(id);
    items.forEach(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      sel.appendChild(o);

  fillSelect('fSheet', data.sheets.map(s => s.name));
  fillSelect('fGruppo', data.gruppi);

  // Popola PdS dopo le opzioni statiche
  const fPdsSel = document.getElementById('fPds');
  if (data.pds && data.pds.length) {
    const sep = document.createElement('option');
    sep.disabled = true;
    sep.textContent = '──────';
    fPdsSel.appendChild(sep);
    data.pds.forEach(p => {
      const o = document.createElement('option');

  // Aule come <button> toggle (stesso elemento di Tutte/Nessuna → stessa resa).
  // Display: rimuove prefisso "Aula"/"Lab".
  const roomChecksDiv = document.getElementById('roomChecks');
  const auleContainer = document.getElementById('roomChecksAule');
  const labsContainer = document.getElementById('roomChecksLab');
  function shortRoomLabel(r) {
    const stripped = String(r).replace(/^\s*(aula|lab)\s+/i, '').trim();
    return stripped || r;
  }
  data.rooms.forEach(r => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'room-toggle';
    btn.dataset.room = r;
    btn.dataset.on = '1';
    btn.title = r;
    btn.textContent = shortRoomLabel(r);
    btn.addEventListener('click', () => {
      btn.dataset.on = btn.dataset.on === '1' ? '0' : '1';
      applyFilters();
    });
    if (/^lab\b/i.test(r)) labsContainer.appendChild(btn);
    else auleContainer.appendChild(btn);
  });
  function getCheckedRooms() {
    const out = {};
    roomChecksDiv.querySelectorAll('button.room-toggle').forEach(b => {
      if (b.dataset.on === '1') out[b.dataset.room] = true;
    });
    return out;
  }
  function setAllRooms(val) {
    roomChecksDiv.querySelectorAll('button.room-toggle').forEach(b => {
      b.dataset.on = val ? '1' : '0';
    });
    applyFilters();
  }
  document.getElementById('btnAllRooms').addEventListener('click', () => setAllRooms(true));
  document.getElementById('btnNoRooms').addEventListener('click', () => setAllRooms(false));

  function applyFilters() {
    const q = (document.getElementById('q').value || '').toLowerCase().trim();
    const parsedQ = parseQuery(q);
    const qTerms = parsedQ.terms;
    const qOp = parsedQ.op;
    const fSheet = document.getElementById('fSheet').value;
    const fGruppo = document.getElementById('fGruppo').value;
    const fAnno = document.getElementById('fAnno').value;
    const fPds = document.getElementById('fPds').value;
    let allowedCodes = null;
    let activePds = null;
    if (fPds === 'LT') allowedCodes = new Set((data.codesLT || []).map(c => c.toLowerCase()));
    else if (fPds === 'LM') allowedCodes = new Set((data.codesLM || []).map(c => c.toLowerCase()));
    else if (fPds.indexOf('PDS:') === 0) {
      const name = fPds.substring(4);
      activePds = (data.pds || []).find(x => x.name === name);
      if (activePds) allowedCodes = new Set(activePds.codes.map(c => c.toLowerCase()));
    }
    const checkedRooms = getCheckedRooms();
    sessionEls.forEach(el => {
      let ok = true;
      if (allowedCodes && !allowedCodes.has(el.dataset.code)) ok = false;
      if (!checkedRooms[el.dataset.room]) ok = false;
      if (fSheet && el.dataset.sheet !== fSheet) ok = false;
      if (fGruppo && el.dataset.gruppo) {
        const g = el.dataset.gruppo;
        // Match: gruppo session è prefisso del filtro (genitore) o filtro è prefisso del gruppo (figlio)
        const isCompat = g.indexOf(fGruppo) === 0 || fGruppo.indexOf(g) === 0;
        if (!isCompat) ok = false;
      }
      if (fAnno && el.dataset.anno.indexOf(fAnno) === -1) ok = false;
      if (qTerms.length) {
        const hay = el.dataset.code + ' ' + el.dataset.name + ' ' + el.dataset.titolare;
        const matches = qOp === 'and'
          ? qTerms.every(t => hay.indexOf(t) !== -1)
          : qTerms.some(t => hay.indexOf(t) !== -1);
        if (!matches) ok = false;
      }
      el.classList.toggle('hidden', !ok);

      // Override colore sfondo: solo per sessioni LM, e solo se un singolo
      // PdS e' selezionato. Tutti i corsi / Tutta LT / Tutta LM / Tutti gli
      // anni → colore originale della tabella (cella F del foglio sorgente).
      const isLM = /LM$/i.test(el.dataset.sheet || '');
      if (activePds && isLM && data.vincoloColors) {
        const codeUpper = (el.dataset.code || '').toUpperCase();
        const v = activePds.vincoloByCode && activePds.vincoloByCode[codeUpper];
        const c = v ? data.vincoloColors[v] : null;
        el.style.background = c || el.dataset.origBg;
      } else {
        el.style.background = el.dataset.origBg;
      }
    });

    // Stessa logica per la vista "Aule" (rsessionEls)
    rsessionEls.forEach(el => {
      let ok = true;
      if (allowedCodes && !allowedCodes.has(el.dataset.code)) ok = false;
      if (!checkedRooms[el.dataset.room]) ok = false;
      if (fSheet && el.dataset.sheet !== fSheet) ok = false;
      if (fGruppo && el.dataset.gruppo) {
        const g = el.dataset.gruppo;
        const isCompat = g.indexOf(fGruppo) === 0 || fGruppo.indexOf(g) === 0;
        if (!isCompat) ok = false;
      }
      if (fAnno && el.dataset.anno.indexOf(fAnno) === -1) ok = false;
      if (qTerms.length) {
        const hay = el.dataset.code + ' ' + el.dataset.name + ' ' + el.dataset.titolare;
        const matches = qOp === 'and'
          ? qTerms.every(t => hay.indexOf(t) !== -1)
          : qTerms.some(t => hay.indexOf(t) !== -1);
        if (!matches) ok = false;
      }
      el.classList.toggle('hidden', !ok);
      if (activePds && data.vincoloColors) {
        const codeUpper = (el.dataset.code || '').toUpperCase();
        const v = activePds.vincoloByCode && activePds.vincoloByCode[codeUpper];
        const c = v ? data.vincoloColors[v] : null;
        el.style.background = c || el.dataset.origBg;
      } else {
        el.style.background = el.dataset.origBg;
      }
    });

    // Nascondi le righe aula deselezionate in TUTTE le day-section della vista Aule
    daySections.forEach(ds => {
      ds.section.querySelectorAll('.grid-row').forEach(row => {
        const r = row.dataset.room;
        if (r) row.classList.toggle('hidden', !checkedRooms[r]);
      });
    });

    // Blocchi NON DISPONIBILE: nascondi se l'aula non e' selezionata.
    // Non applichiamo altri filtri (non hanno code/gruppo/sheet/ecc.).
    unavailEls.forEach(el => {
      el.classList.toggle('hidden', !checkedRooms[el.dataset.room]);
    });

    relayoutVisible();
  }
  ['q','fSheet','fGruppo','fAnno','fPds'].forEach(id => {
    document.getElementById(id).addEventListener('input', applyFilters);
    document.getElementById(id).addEventListener('change', applyFilters);
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    ['q','fSheet','fGruppo','fAnno','fPds'].forEach(id => { document.getElementById(id).value = ''; });
    setAllRooms(true);
  });

  // Legenda fogli (colori)
  const leg = document.getElementById('legend');
  data.sheets.forEach(sh => {
    const span = document.createElement('span');
    span.innerHTML = '<span class="dot" style="background:' + sh.color + '"></span>' + sh.name;
    leg.appendChild(span);
  });
  document.getElementById('footer').textContent =
    'Generato ' + new Date(data.generatedAt).toLocaleString('it-IT') +
    ' · ' + data.sessions.length + ' sessioni';

  // Layout iniziale (tutti visibili)
  relayoutVisible();

  // Query parser: tokenizza rispettando "stringhe quotate", poi applica binary op.
  // A | A B | A or B | A and B. Oltre il binario, ignora.
  function tokenizeQuery(q) {
    const tokens = [];
    let buf = '';
    let inQuote = false;
    for (let i = 0; i < q.length; i++) {
      const c = q[i];
      if (c === '"') {
        if (inQuote) {
          tokens.push(buf);
          buf = '';
          inQuote = false;
        } else {
          if (buf) { tokens.push(buf); buf = ''; }
          inQuote = true;
        }
      } else if (!inQuote && /\s/.test(c)) {
        if (buf) { tokens.push(buf); buf = ''; }
      } else {
        buf += c;
      }
    }
    if (buf) tokens.push(buf);
    return tokens.filter(t => t.length > 0);
  }

  function parseQuery(q) {
    const raw = tokenizeQuery(q);
    if (raw.length === 0) return { terms: [], op: 'or' };
    if (raw.length >= 3 && (raw[1] === 'or' || raw[1] === 'and')) {
      const op = raw[1];
      const terms = [raw[0], raw[2]].filter(t => t !== 'or' && t !== 'and');
      return { terms: terms, op: op };
    }
    const terms = raw.filter(t => t !== 'or' && t !== 'and').slice(0, 2);
    return { terms: terms, op: 'or' };
  }

  function fmt(min) {
    const h = Math.floor(min / 60), m = min % 60;
    return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
})();
</script>
